spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
firebase.project-id=toeicpractice-1445a
firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Chỉ bật biến này khi cần import/re-import bộ đề vào Firestore.
app.import-toeic-data=${IMPORT_TOEIC_DATA:false}
app.toeic-data-resource=classpath:data/test-1-data.json

# Chỉ cập nhật 5 imageUrl của các group Part 3-4, giữ nguyên dữ liệu Firestore còn lại.
app.import-listening-images=${IMPORT_LISTENING_IMAGES:false}
app.listening-image-test-id=${LISTENING_IMAGE_TEST_ID:test-1}

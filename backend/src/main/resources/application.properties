spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
firebase.project-id=toeicpractice-1445a
firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Chỉ bật biến này khi cần import/re-import bộ đề vào Firestore.
app.import-toeic-data=${IMPORT_TOEIC_DATA:false}
app.toeic-data-resource=${TOEIC_DATA_RESOURCE:classpath:data/test-3-data.json}

# Chỉ cập nhật 5 imageUrl của các group Part 3-4, giữ nguyên dữ liệu Firestore còn lại.
app.import-listening-images=${IMPORT_LISTENING_IMAGES:false}
app.listening-image-test-id=${LISTENING_IMAGE_TEST_ID:test-1}

# Chỉ cập nhật transcript và transcriptTranslation của 23 group Part 3-4.
app.import-listening-review-text=${IMPORT_LISTENING_REVIEW_TEXT:false}
app.listening-review-text-test-id=${LISTENING_REVIEW_TEXT_TEST_ID:test-1}
app.listening-review-text-resource=${LISTENING_REVIEW_TEXT_RESOURCE:classpath:data/test-1-data.json}

# RabbitMQ
spring.rabbitmq.addresses=${CLOUDAMQP_URL}
spring.rabbitmq.connection-timeout=10s

app.ai.exchange=toeic.ai
app.ai.request-routing-key=ai.request
app.ai.result-queue=toeic.ai.result
app.ai.test-endpoint-enabled=${AI_TEST_ENDPOINT_ENABLED:false}

spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
firebase.project-id=toeicpractice-1445a
firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=2048

# Firebase session cookie authentication. Production must keep Secure enabled;
# local HTTP development sets AUTH_COOKIE_SECURE=false.
app.auth.cookie-name=session
app.auth.session-duration=7d
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=Lax

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Chỉ bật biến này khi cần import/re-import bộ đề vào Firestore.
app.import-toeic-data=${IMPORT_TOEIC_DATA:false}
app.toeic-data-resource=${TOEIC_DATA_RESOURCE:classpath:data/test-3-data.json}

# Chỉ cập nhật 5 imageUrl của các group Part 3-4, giữ nguyên dữ liệu Firestore còn lại.
app.import-listening-images=${IMPORT_LISTENING_IMAGES:false}
app.listening-image-test-id=${LISTENING_IMAGE_TEST_ID:test-1}

# Chỉ cập nhật nội dung review Listening: transcript/bản dịch Part 1-2 và
# transcript/bản dịch/giải thích chi tiết Part 3-4; giữ nguyên dữ liệu khác.
app.import-listening-review-text=${IMPORT_LISTENING_REVIEW_TEXT:false}
app.listening-review-text-test-id=${LISTENING_REVIEW_TEXT_TEST_ID:test-1}
app.listening-review-text-resource=${LISTENING_REVIEW_TEXT_RESOURCE:classpath:data/test-1-data.json}

# RabbitMQ
spring.rabbitmq.addresses=${CLOUDAMQP_URL}
spring.rabbitmq.connection-timeout=10s

app.ai.exchange=toeic.ai
app.ai.request-routing-key=ai.request
app.ai.result-queue=toeic.ai.result
app.ai.review-request-queue=toeic.ai.review.request
app.ai.review-request-routing-key=ai.review.request
app.ai.review-completed-queue=toeic.ai.review.completed
app.ai.review-completed-routing-key=ai.review.completed
app.ai.review-failed-queue=toeic.ai.review.failed
app.ai.review-failed-routing-key=ai.review.failed
app.ai.chat-request-queue=toeic.ai.chat.request
app.ai.chat-request-routing-key=ai.chat.request
app.ai.chat-result-queue=toeic.ai.chat.result
app.ai.chat-result-routing-key=ai.chat.result
app.ai.dead-letter-exchange=toeic.ai.dlx
app.ai.dead-letter-queue=toeic.ai.request.dlq
app.ai.dead-letter-routing-key=ai.request.dead
app.ai.test-endpoint-enabled=${AI_TEST_ENDPOINT_ENABLED:false}

# Capy AI chat limits
app.ai.chat.daily-limit=${AI_CHAT_DAILY_LIMIT:30}
app.ai.chat.burst-limit=${AI_CHAT_BURST_LIMIT:5}
app.ai.chat.conversation-limit=${AI_CHAT_CONVERSATION_LIMIT:10}
app.ai.chat.read-limit=${AI_CHAT_READ_LIMIT:100}
app.ai.chat.message-character-limit=${AI_CHAT_MESSAGE_CHARACTER_LIMIT:1000}
app.ai.chat.history-message-limit=${AI_CHAT_HISTORY_MESSAGE_LIMIT:12}

# PayOS (thanh toán gói Pro). Key lấy từ PayOS Dashboard, KHÔNG commit key thật.
# payos.sandbox=true chỉ mở gói test 10.000đ/1 ngày; production để false.
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
payos.sandbox=${PAYOS_SANDBOX:false}

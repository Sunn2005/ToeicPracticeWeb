name: Keep backend awake

on:
  schedule:
    # Render free instances sleep after about 15 minutes without traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API so history and practice do not wait on a cold start
        run: curl --silent --show-error --max-time 120 --output /dev/null --write-out "%{http_code}\n" https://toeicpracticeweb.onrender.com/api/health

spring.application.name=ai-service
server.port=${PORT:8081}

spring.config.import=optional:file:.env[.properties],optional:file:ai-service/.env[.properties]

# Gemini
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:16384}

# Firestore
firebase.project-id=${FIREBASE_PROJECT_ID:toeicpractice-1445a}
firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}

# RabbitMQ
spring.rabbitmq.addresses=${CLOUDAMQP_URL}
spring.rabbitmq.connection-timeout=10s
spring.rabbitmq.listener.simple.prefetch=1

# Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Messaging topology
app.rabbitmq.exchange=toeic.ai
app.rabbitmq.request-queue=toeic.ai.request
app.rabbitmq.request-routing-key=ai.request
app.rabbitmq.result-queue=toeic.ai.result
app.rabbitmq.result-routing-key=ai.result
app.rabbitmq.review-request-queue=toeic.ai.review.request
app.rabbitmq.review-request-routing-key=ai.review.request
app.rabbitmq.review-completed-queue=toeic.ai.review.completed
app.rabbitmq.review-completed-routing-key=ai.review.completed
app.rabbitmq.review-failed-queue=toeic.ai.review.failed
app.rabbitmq.review-failed-routing-key=ai.review.failed

app.rabbitmq.dead-letter-exchange=toeic.ai.dlx
app.rabbitmq.dead-letter-queue=toeic.ai.request.dlq
app.rabbitmq.dead-letter-routing-key=ai.request.dead

# Consumer retry
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Full-test review
app.ai.review.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.review.prompt-version=toeic-analysis-v1
app.ai.review.schema-version=1.0
app.ai.review.max-attempts=${AI_REVIEW_MAX_ATTEMPTS:3}
app.ai.review.initial-backoff-ms=${AI_REVIEW_INITIAL_BACKOFF_MS:1000}
app.ai.review.request-timeout-ms=${AI_REVIEW_REQUEST_TIMEOUT_MS:120000}

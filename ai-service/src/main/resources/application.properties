spring.application.name=ai-service
server.port=${PORT:8081}

spring.config.import=optional:file:.env[.properties],optional:file:ai-service/.env[.properties]

# Gemini
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.max-output-tokens=1024

# RabbitMQ
spring.rabbitmq.addresses=${CLOUDAMQP_URL}
spring.rabbitmq.connection-timeout=10s
spring.rabbitmq.listener.simple.prefetch=1

# Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Messaging topology
app.rabbitmq.exchange=toeic.ai
app.rabbitmq.request-queue=toeic.ai.request
app.rabbitmq.request-routing-key=ai.request
app.rabbitmq.result-queue=toeic.ai.result
app.rabbitmq.result-routing-key=ai.result

app.rabbitmq.dead-letter-exchange=toeic.ai.dlx
app.rabbitmq.dead-letter-queue=toeic.ai.request.dlq
app.rabbitmq.dead-letter-routing-key=ai.request.dead

# Consumer retry
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
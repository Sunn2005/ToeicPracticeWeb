<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#f0f9ff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> CapyTOEIC</title>
    <style>
      .initial-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f0f9ff 0%, #fff 52%, #fffbeb 100%);
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .initial-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .initial-splash__logo {
        width: min(52vw, 208px);
        height: min(52vw, 208px);
        border: 2px solid rgba(125, 211, 252, 0.45);
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(14, 165, 233, 0.2);
        object-fit: contain;
      }

      .initial-splash__title {
        margin: 24px 0 0;
        font-size: 20px;
        font-weight: 700;
      }

      .initial-splash__text {
        margin: 8px 0 0;
        color: #0369a1;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash" role="status" aria-live="polite">
        <div class="initial-splash__content">
          <img class="initial-splash__logo" src="/brand/apple-touch-icon.png" alt="" />
          <p class="initial-splash__title">CapyTOEIC</p>
          <p class="initial-splash__text">Loading...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
